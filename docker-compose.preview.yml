# Private converter only. Attach Windmill workers to document-preview as well as
# their existing network. No host ports, public domain, or outbound network.
services:
  document-preview:
    image: gotenberg/gotenberg:8.38.0
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=180s
      - --api-body-limit=26MB
      - --api-enable-basic-auth
      - --api-disable-download-from
      - --webhook-disable
      - --chromium-disable-routes
      - --libreoffice-deny-list=.*
      - --libreoffice-max-queue-size=4
    environment:
      GOTENBERG_API_BASIC_AUTH_USERNAME: ${PREVIEW_GOTENBERG_USERNAME:?Set a private converter username}
      GOTENBERG_API_BASIC_AUTH_PASSWORD: ${PREVIEW_GOTENBERG_PASSWORD:?Set a private converter password}
    networks:
      - document-preview
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  document-preview:
    name: document-preview
    internal: true
